name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish to Open VSX only
        required: true
        type: string
        default: v0.0.8

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-open-vsx:
    # Configuration changes exercise authentication against an existing version.
    # No new version is published from a branch push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download an already published version
        run: npx --no-install ovsx get skrtk98.mupdf-viewer --output "$RUNNER_TEMP/published.vsix"
      - name: Verify trusted publishing with duplicate protection
        run: npx --no-install ovsx publish "$RUNNER_TEMP/published.vsix" --trusted-publishing --skip-duplicate

  package:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag format
        run: node -e 'if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) throw new Error("Expected a stable vX.Y.Z tag");'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package version
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag must match package.json");'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build and package
        run: npm run package -- --out mupdf-viewer.vsix --baseContentUrl "https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}" --baseImagesUrl "https://github.com/${GITHUB_REPOSITORY}/raw/${RELEASE_TAG}"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: mupdf-viewer.vsix
          if-no-files-found: error

  publish-marketplace:
    # On main, verify the same authentication path against an existing version.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       (startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success'))
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: extension-vsix
      - name: Download an already published Marketplace version for verification
        if: github.ref == 'refs/heads/main'
        run: >-
          curl --fail --location --compressed --retry 3
          'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/skrtk98/vsextensions/mupdf-viewer/0.0.8/vspackage'
          --output mupdf-viewer.vsix
      - name: Sign in through GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify Marketplace publishing rights
        run: npx --no-install vsce verify-pat skrtk98 --azure-credential
      - name: Publish to Visual Studio Marketplace
        run: npx --no-install vsce publish --azure-credential --packagePath mupdf-viewer.vsix --skip-duplicate

  publish-open-vsx:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # On manual runs use the workflow revision's locked tools, even when the
      # extension is built from an older tag that predates OIDC support.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - name: Publish to Open VSX with trusted publishing
        run: npx --no-install ovsx publish mupdf-viewer.vsix --trusted-publishing --skip-duplicate

  github-release:
    needs: [package, publish-marketplace, publish-open-vsx]
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      needs.publish-open-vsx.result == 'success' &&
      (needs.publish-marketplace.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.publish-marketplace.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - name: Create release and attach the published VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" mupdf-viewer.vsix --repo "$GITHUB_REPOSITORY" --clobber
