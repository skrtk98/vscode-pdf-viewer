name: Verify Marketplace authentication

on:
  workflow_dispatch:
    inputs:
      verify_permissions:
        description: Verify publishing rights after adding the identity to the publisher
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sign in through GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Retrieve the Marketplace identity ID
        env:
          VERIFY_PERMISSIONS: ${{ inputs.verify_permissions }}
        run: |
          identity_id=$(az rest \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv)
          [[ "$identity_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
            echo 'The profile API did not return an identity UUID.'
            exit 1
          }
          {
            echo '### Marketplace identity'
            echo "Identity ID: \`$identity_id\`"
            if [ "$VERIFY_PERMISSIONS" != true ]; then
              echo 'Add this identity to publisher `skrtk98` as a Contributor.'
              echo 'Then start a new run with verify_permissions enabled.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify publishing rights without uploading an extension
        if: inputs.verify_permissions
        run: |
          npx --no-install vsce verify-pat skrtk98 --azure-credential
          echo 'Publishing rights for `skrtk98` verified successfully through Microsoft Entra ID.' >> "$GITHUB_STEP_SUMMARY"
